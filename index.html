<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Classroom</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Overlay to ensure parent page intercepts keys if frame prevents focus */
        .focus-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Embedded Website iframe (Full Screen) -->
    <div class="iframe-container">
        <div class="focus-overlay" id="overlay"></div>
        <iframe id="game-frame" src="https://commonsensehealthcare.org" sandbox="allow-scripts allow-same-origin allow-forms" title="Common Sense Healthcare"></iframe>
    </div>

    <script>
        const iframe = document.getElementById('game-frame');
        const overlay = document.getElementById('overlay');

        // Shortcut Listener
        window.addEventListener('keydown', function(e) {
            // Check for Ctrl + E (or Cmd + E on Mac)
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'e') {
                e.preventDefault(); // Prevents default browser search bar dropdowns
                
                // Changes the iframe destination without opening tabs or redirects
                iframe.src = "https://commonsensehealthcare.org"; 
            }
        });

        // Toggle pointer events to ensure the outer container retains key tracking
        window.addEventListener('blur', function() {
            overlay.style.pointerEvents = 'auto';
            setTimeout(() => {
                window.focus();
                overlay.style.pointerEvents = 'none';
            }, 100);
        });
    </script>
</body>
</html>
